<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — AFU Digital Library</title>
  <link rel="icon" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("afu-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
</head>
<body>
  <header class="brand"><div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo.png" alt="Auto Focus UTBK"></a>
    <div class="ctrl"><button id="themeBtn" class="icon-btn" aria-label="Ganti tema" type="button">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
    </div></header>
  <div class="bar"><div class="wrap bar-in">
    <nav class="nav"><a href="index.html">Kembali ke website</a></nav>
  </div></div>

  <main class="wrap page narrow">
    <h1>Admin</h1>

    <section id="login" class="card form">
      <h2>Masuk</h2>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button class="btn" type="submit">Masuk</button>
      </form>
      <p id="loginMsg" class="notice" hidden></p>
    </section>

    <div id="panel" hidden>
      <p class="muted">Masuk sebagai <span id="who"></span> · <button id="logout" class="linkbtn" type="button">Keluar</button></p>
      <section class="card form" id="formCard">
        <h2 id="formTitle">Tambah dokumen PDF</h2>
        <form id="uploadForm">
          <label>Jenis<select id="type"><option value="soal">Modul Soal</option><option value="pembahasan">Pembahasan</option></select></label>
          <label>Subtes<select id="subtest"></select></label>
          <label>Kategori<input id="category" list="cats" placeholder="Contoh: Try Out 2026, Latihan Dasar"><datalist id="cats"></datalist></label>
          <label>Judul<input id="title" placeholder="Contoh: Try Out PU Paket 1"><span class="hint" id="titleHint">Kalau memilih banyak file, judul otomatis diambil dari nama file.</span></label>
          <label id="pairLabel" hidden>Pasangan (soal ↔ pembahasan)<select id="pair"></select><span class="hint">Hanya muncul saat mengedit. Dokumen pasangan akan saling terhubung di website.</span></label>
          <label>Deskripsi<textarea id="desc" rows="2" placeholder="Opsional"></textarea></label>
          <label id="fileLabel">File PDF (boleh pilih banyak sekaligus)<input id="file" type="file" accept="application/pdf" multiple></label>
          <div class="btns">
            <button id="uploadBtn" class="btn" type="submit">Upload</button>
            <button id="cancelEdit" class="btn ghost" type="button" hidden>Batal edit</button>
          </div>
        </form>
        <p id="upMsg" class="notice" hidden></p>
      </section>
      <section class="card form">
        <h2>Pengaturan situs</h2>
        <form id="setForm">
          <label>Pengumuman di atas beranda (kosongkan untuk menyembunyikan)<textarea id="set_ann" rows="2" placeholder="Contoh: Try out UTBK baru sudah tersedia!"></textarea></label>
          <label>Tanggal dan jam UTBK untuk hitung mundur (WIB)<input id="set_date" type="datetime-local" required></label>
          <label><input id="set_conf" type="checkbox" style="display:inline;width:auto;margin:0 .5rem 0 0"> Tanggal sudah resmi dari SNPMB (kalau tidak dicentang, tampil "Perkiraan jadwal")</label>
          <button class="btn" type="submit">Simpan pengaturan</button>
        </form>
        <p id="setMsg" class="notice" hidden></p>
      </section>
      <section class="card form">
        <h2>Dokumen tersimpan</h2>
        <p><button id="csvBtn" class="btn ghost sm" type="button">Ekspor daftar ke CSV</button></p>
        <div id="rows"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>AFU.init();</script>
  <script src="js/admin.js"></script>
</body>
</html>
